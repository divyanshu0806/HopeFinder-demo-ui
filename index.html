<style>
/* ============ TOKENS ============ */
:root{
  --bg:#F5F7FA;
  --surface:#FFFFFF;
  --surface-alt:#EEF2F7;
  --border:#E2E8EF;
  --border-strong:#CBD5E1;
  --text:#101B2D;
  --text-soft:#4B5768;
  --text-faint:#8592A3;
  --blue:#1D4FA8;
  --blue-dark:#123B85;
  --blue-tint:#E9F0FC;
  --teal:#0E8A82;
  --teal-tint:#E4F6F4;
  --red:#D8332B;
  --red-tint:#FCEAE9;
  --amber:#C9740A;
  --amber-tint:#FBF0DF;
  --green:#1C8A4B;
  --green-tint:#E7F6ED;
  --radius-sm:10px;
  --radius-md:14px;
  --radius-lg:20px;
  --shadow-sm:0 1px 2px rgba(16,27,45,0.06);
  --shadow-md:0 4px 16px rgba(16,27,45,0.08);
  --shadow-lg:0 12px 32px rgba(16,27,45,0.14);
  --font: -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;background:#0b1220;}
html{ overflow-y:auto; }
body{
  font-family:var(--font);
  color:var(--text);
  display:flex; justify-content:center; align-items:center;
  min-height:100vh;
  padding:10px;
  background:radial-gradient(circle at 50% 0%,#1b2740,#0b1220 70%);
  overflow-y:auto;
}
/* ============ PHONE FRAME (device mockup) ============ */
/* Width/height are set by JS (fitPhoneFrame) to exactly fill the available
   viewport, since vh/vw units are unreliable inside embedded iframes.
   These are just fallback values before JS runs. */
.phone-frame{
  position:relative;
  width:390px; height:844px;
  max-width:96vw; max-height:96vh;
  box-sizing:border-box;
  background:linear-gradient(160deg,#1a2333,#0d1420);
  border-radius:44px;
  padding:12px;
  box-shadow:0 40px 90px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06) inset;
  flex-shrink:0;
}
.phone-sidebtn{ position:absolute; background:#0d1420; border-radius:3px; }
.phone-sidebtn.power{ right:-3px; top:150px; width:3px; height:60px; }
.phone-sidebtn.vol1{ left:-3px; top:110px; width:3px; height:30px; }
.phone-sidebtn.vol2{ left:-3px; top:150px; width:3px; height:50px; }
.phone-notch{
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  width:120px; height:24px; background:#0d1420; border-bottom-left-radius:16px; border-bottom-right-radius:16px; z-index:80;
}
.phone-screen{
  position:relative;
  width:100%; height:100%;
  background:var(--bg);
  border-radius:32px;
  overflow:hidden;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.05);
}
.phone-home-indicator{
  position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
  width:118px; height:4px; border-radius:3px; background:rgba(255,255,255,.28); z-index:80;
}
.status-bar{
  position:absolute; top:0; left:0; right:0; height:32px; z-index:70;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 28px; font-size:12.5px; font-weight:700; color:var(--text);
  background:var(--surface);
}
.status-bar .sb-icons{ display:flex; align-items:center; gap:5px; }
.status-bar svg{ width:15px; height:15px; }
#device{ display:none; } /* legacy, unused */
#app{ position:absolute; top:32px; left:0; right:0; bottom:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding-bottom:82px; display:flex; flex-direction:column; }
::selection{ background:var(--blue-tint); }
button{ font-family:inherit; cursor:pointer; }
a{ text-decoration:none; color:inherit; }
input,textarea,select{ font-family:inherit; }
.scr{ animation: fadein .18s ease; display:flex; flex-direction:column; flex:1; }
@keyframes fadein{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
.hidden{ display:none !important; }

/* ============ TOP HEADER ============ */
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
  display:flex; align-items:center; gap:12px;
}
.topbar .icon-btn{
  width:36px;height:36px;border-radius:10px;border:none;background:var(--surface-alt);
  display:flex;align-items:center;justify-content:center;color:var(--text-soft); flex-shrink:0; position:relative;
}
.topbar .icon-btn:active{ background:var(--border); }
.topbar .brand{ flex:1; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px; }
.brand-badge{ width:28px;height:28px;border-radius:8px; overflow:hidden; display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px; background:#fff; }
.brand-badge img{ width:100%; height:100%; object-fit:cover; }
.brand-name{ font-weight:800; font-size:15px; letter-spacing:-0.02em; color:var(--text); }
.dot-badge{ position:absolute; top:5px; right:5px; width:8px;height:8px;border-radius:50%; background:var(--red); border:1.5px solid var(--surface); }
.header-title{ font-size:16px; font-weight:700; flex:1; }

.location-strip{
  padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; font-size:12.5px;
}
.location-strip .loc{ display:flex; align-items:center; gap:6px; color:var(--text); font-weight:600; }
.location-strip .status{ color:var(--green); display:flex; align-items:center; gap:5px; font-weight:600; }
.status-dot{ width:6px;height:6px;border-radius:50%; background:var(--green); }
.offline .status{ color:var(--amber); }
.offline .status-dot{ background:var(--amber); }

/* ============ SCROLL AREA ============ */
.content{ flex:1; padding:16px; padding-bottom:24px; }
.content.nopad{ padding:0; }

/* ============ BOTTOM NAV ============ */
/* #bottomNavHost is a persistent sibling of #app (not nested inside the
   scrolling content), pinned to the bottom of .phone-screen. This avoids
   relying on an absolutely-positioned element inside a scrolling container
   (which can misbehave when the scroll container's own box sizing gets
   affected by flex/content quirks) — it simply always renders at the
   bottom edge of the phone, regardless of #app's scroll position. */
#bottomNavHost{
  position:absolute; bottom:0; left:0; right:0; z-index:40;
}
.bottomnav{
  background:var(--surface); border-top:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-around; padding:8px 6px 20px;
}
.nav-item{ background:none;border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:10px; }
.nav-item.active{ color:var(--blue); }
.nav-item svg{ width:21px; height:21px; }
.nav-sos{ background:var(--red); color:#fff; width:50px;height:50px;border-radius:50%; display:flex;align-items:center;justify-content:center; margin-top:-26px; box-shadow:0 6px 16px rgba(216,51,43,0.4); border:3px solid var(--surface); }
.nav-sos svg{ width:22px;height:22px; }
.nav-sos span{ display:none; }

/* ============ CARDS ============ */
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-sm); }
.section-title{ font-size:12.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.04em; margin:22px 0 10px; }
.section-title:first-child{ margin-top:0; }

/* Alert banner */
.alert-banner{ border-radius:var(--radius-md); padding:14px; border:1px solid #F2C9C7; background:linear-gradient(180deg,#FDECEB,#FBE2E0); position:relative; overflow:hidden; }
.alert-banner .row1{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.alert-flag{ display:flex; align-items:center; gap:6px; color:var(--red); font-weight:700; font-size:12.5px; }
.severity-pill{ background:var(--red); color:#fff; font-size:10.5px; font-weight:800; padding:4px 9px; border-radius:20px; letter-spacing:.02em; }
.alert-banner h3{ margin:2px 0 6px; font-size:16px; color:#7A211C; }
.alert-banner p{ margin:0 0 10px; font-size:13px; color:#7A2A26; line-height:1.5; }
.alert-meta{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:#9A5450; }
.link-btn{ color:var(--red); font-weight:700; font-size:12.5px; display:flex; align-items:center; gap:3px; background:none; border:none; padding:0; }

/* Emergency grid */
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.svc-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 12px; display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow-sm); text-align:left; border-bottom:3px solid transparent; }
.svc-card:active{ background:var(--surface-alt); }
.svc-ic{ width:36px;height:36px;border-radius:10px; display:flex;align-items:center;justify-content:center; }
.svc-card b{ font-size:13.5px; color:var(--text); }
.svc-card small{ font-size:11px; color:var(--text-faint); }

/* AI card */
.ai-card{ background:linear-gradient(135deg,var(--blue-dark),var(--blue) 60%, var(--teal)); border-radius:var(--radius-lg); padding:18px; color:#fff; box-shadow:var(--shadow-md); }
.ai-card .top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.ai-avatar{ width:34px;height:34px;border-radius:10px; background:rgba(255,255,255,.18); display:flex;align-items:center;justify-content:center; font-size:17px; }
.ai-card h4{ margin:0; font-size:15px; }
.live-chip{ background:rgba(255,255,255,.2); font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; margin-left:6px; }
.ai-card p{ font-size:12.5px; line-height:1.5; margin:6px 0 14px; color:rgba(255,255,255,.88); }
.ai-actions{ display:flex; gap:8px; }
.btn-white{ flex:1; background:#fff; color:var(--blue-dark); border:none; border-radius:12px; padding:11px; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; }
.btn-ghost-white{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.35); border-radius:12px; padding:11px 14px; font-weight:700; font-size:13px; display:flex;align-items:center;gap:6px; }
.quick-prompts{ display:flex; gap:7px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
.qp{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:20px; padding:7px 12px; font-size:11.5px; white-space:nowrap; font-weight:600; }

/* Resource rows */
.res-row{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px; margin-bottom:10px; box-shadow:var(--shadow-sm); }
.res-ic{ width:42px;height:42px;border-radius:11px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.res-row .info{ flex:1; min-width:0; }
.res-row .info b{ font-size:13.5px; display:block; }
.res-row .info small{ color:var(--text-faint); font-size:11.5px; }
.pill-btn{ border:none; border-radius:10px; padding:9px 13px; font-weight:700; font-size:12px; display:flex; align-items:center; gap:5px; white-space:nowrap; }
.pill-btn.blue{ background:var(--blue); color:#fff; }
.pill-btn.red{ background:var(--red); color:#fff; }
.pill-btn.outline{ background:var(--surface); color:var(--blue); border:1.5px solid var(--blue); }
.pill-btn.gray{ background:var(--surface-alt); color:var(--text-soft); }

/* Generic list card row */
.list-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:12px; box-shadow:var(--shadow-sm); }
.list-card .row-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
.badge{ font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px; letter-spacing:.02em; white-space:nowrap; }
.badge.red{ background:var(--red-tint); color:var(--red); }
.badge.amber{ background:var(--amber-tint); color:var(--amber); }
.badge.green{ background:var(--green-tint); color:var(--green); }
.badge.blue{ background:var(--blue-tint); color:var(--blue); }
.badge.gray{ background:var(--surface-alt); color:var(--text-soft); }

/* Buttons generic */
.btn{ width:100%; border:none; border-radius:13px; padding:14px; font-weight:700; font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn.primary{ background:var(--blue); color:#fff; }
.btn.danger{ background:var(--red); color:#fff; }
.btn.outline{ background:var(--surface); border:1.5px solid var(--border-strong); color:var(--text); }
.btn.success{ background:var(--green); color:#fff; }
.btn[disabled]{ opacity:.5; }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ flex:1; }

/* Forms */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-soft); margin-bottom:6px; }
.field input[type=text], .field input[type=number], .field input[type=tel], .field textarea, .field select{
  width:100%; border:1.5px solid var(--border); border-radius:11px; padding:12px; font-size:14px; background:var(--surface); color:var(--text);
}
.field textarea{ resize:vertical; min-height:80px; }
.field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--blue); }
.chip-select{ display:flex; flex-wrap:wrap; gap:8px; }
.chip{ padding:10px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface); font-size:13px; font-weight:600; color:var(--text-soft); display:flex; align-items:center; gap:6px; }
.chip.selected{ border-color:var(--blue); background:var(--blue-tint); color:var(--blue); }
.upload-box{ border:1.5px dashed var(--border-strong); border-radius:12px; padding:18px; text-align:center; color:var(--text-faint); font-size:12.5px; background:var(--surface-alt); }
.upload-box b{ display:block; color:var(--text-soft); font-size:13px; margin-top:4px; }

/* Stepper */
.stepper{ display:flex; align-items:center; margin-bottom:20px; }
.stepper .step{ display:flex; align-items:center; gap:8px; flex:1; }
.stepper .circle{ width:26px;height:26px;border-radius:50%; background:var(--surface-alt); color:var(--text-faint); display:flex;align-items:center;justify-content:center; font-size:12px; font-weight:800; border:1.5px solid var(--border); flex-shrink:0; }
.stepper .step.done .circle{ background:var(--green); color:#fff; border-color:var(--green); }
.stepper .step.current .circle{ background:var(--blue); color:#fff; border-color:var(--blue); }
.stepper .label{ font-size:11.5px; font-weight:700; color:var(--text-faint); }
.stepper .step.current .label, .stepper .step.done .label{ color:var(--text); }
.stepper .bar{ height:2px; flex:1; background:var(--border); margin:0 4px; }
.stepper .bar.done{ background:var(--green); }

/* Tabs */
.tabs{ display:flex; background:var(--surface-alt); border-radius:12px; padding:4px; gap:4px; margin-bottom:16px; }
.tab{ flex:1; border:none; background:none; padding:9px 6px; border-radius:9px; font-weight:700; font-size:12.5px; color:var(--text-faint); }
.tab.active{ background:var(--surface); color:var(--blue); box-shadow:var(--shadow-sm); }

/* Empty / loading / error */
.state-box{ text-align:center; padding:40px 20px; color:var(--text-faint); }
.state-box .ic{ font-size:32px; margin-bottom:10px; }
.state-box b{ display:block; color:var(--text-soft); font-size:14px; margin-bottom:4px; }
.spinner{ width:26px;height:26px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 12px; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.toast{ position:absolute; bottom:96px; left:50%; transform:translateX(-50%); background:#101B2D; color:#fff; padding:11px 18px; border-radius:30px; font-size:12.5px; font-weight:600; box-shadow:var(--shadow-lg); z-index:99; display:flex; align-items:center; gap:8px; max-width:82%; text-align:center; }

/* SOS screen */
.sos-hero{ text-align:center; padding:26px 10px 10px; }
.sos-ring{ width:150px;height:150px; border-radius:50%; margin:0 auto 18px; background:radial-gradient(circle,var(--red-tint) 0%, transparent 70%); display:flex; align-items:center; justify-content:center; }
.sos-btn-big{ width:112px;height:112px; border-radius:50%; background:linear-gradient(160deg,#E24138,var(--red)); color:#fff; border:none; box-shadow:0 10px 26px rgba(216,51,43,.4); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-weight:800; font-size:12.5px; }
.sos-btn-big svg{ width:30px;height:30px; }
.slider-track{ position:relative; height:60px; border-radius:30px; background:var(--red-tint); border:1.5px solid #F2C9C7; margin-top:22px; overflow:hidden; user-select:none; }
.slider-fill{ position:absolute; top:0; left:0; bottom:0; background:linear-gradient(90deg,#F3B3AF,var(--red)); border-radius:30px; }
.slider-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#8A2C26; font-weight:700; font-size:13px; letter-spacing:.01em; pointer-events:none; }
.slider-thumb{ position:absolute; top:5px; left:5px; width:50px;height:50px; border-radius:50%; background:var(--red); display:flex;align-items:center;justify-content:center; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.25); touch-action:none; }
.info-row{ display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:13px; }
.info-row:last-child{ border-bottom:none; }
.info-row span:first-child{ color:var(--text-faint); }
.info-row span:last-child{ font-weight:700; color:var(--text); }

/* Status timeline */
.timeline{ margin-top:6px; }
.tl-item{ display:flex; gap:12px; }
.tl-dotcol{ display:flex; flex-direction:column; align-items:center; }
.tl-dot{ width:22px;height:22px;border-radius:50%; background:var(--surface-alt); border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.tl-dot.done{ background:var(--green); border-color:var(--green); color:#fff; }
.tl-dot.active{ background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 0 4px var(--blue-tint); }
.tl-line{ width:2px; flex:1; background:var(--border-strong); min-height:26px; }
.tl-line.done{ background:var(--green); }
.tl-body{ padding-bottom:22px; }
.tl-body b{ font-size:13.5px; display:block; }
.tl-body small{ color:var(--text-faint); font-size:11.5px; }

/* Map */
#leafletMap{ width:100%; height:100%; }
.map-filterbar{ position:absolute; top:12px; left:12px; right:12px; z-index:20; display:flex; gap:7px; overflow-x:auto; }
.map-filter{ background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-md); border-radius:20px; padding:8px 14px; font-size:12px; font-weight:700; color:var(--text-soft); white-space:nowrap; }
.map-filter.active{ background:var(--blue); color:#fff; border-color:var(--blue); }
.map-wrap{ position:relative; height:360px; flex-shrink:0; }
.map-legend{ background:var(--surface); border-top:1px solid var(--border); padding:12px 16px 16px; }
.legend-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:11.5px; color:var(--text-soft); }
.legend-grid div{ display:flex; align-items:center; gap:6px; }
.leg-dot{ width:10px;height:10px;border-radius:50%; flex-shrink:0; }
.nearby-strip{ display:flex; gap:10px; overflow-x:auto; padding:12px 12px; background:var(--surface); border-bottom:1px solid var(--border); }
.nearby-card{ display:flex; align-items:center; gap:9px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:9px 12px; min-width:190px; box-shadow:var(--shadow-sm); flex-shrink:0; text-align:left; }
.nearby-card:active{ background:var(--surface-alt); }
.nc-ic{ width:34px;height:34px;border-radius:10px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.nc-info{ min-width:0; }
.nc-info b{ font-size:12.5px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:130px; }
.nc-info small{ font-size:11px; color:var(--text-faint); display:block; margin-top:1px; }
.nc-info .nc-dist{ color:var(--blue); font-weight:700; }
.popup-card{ font-family:var(--font); min-width:180px; }
.popup-card b{ display:block; font-size:13px; margin-bottom:3px; }
.popup-card .pmeta{ font-size:11px; color:var(--text-faint); margin-bottom:8px; }

/* Chat */
.chat-wrap{ display:flex; flex-direction:column; height:calc(100vh - 190px); }
.chat-scroll{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:82%; padding:11px 13px; border-radius:14px; font-size:13.5px; line-height:1.5; }
.msg.bot{ align-self:flex-start; background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
.msg.user{ align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
.msg .tag{ font-size:9.5px; font-weight:800; color:var(--teal); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
.chat-inline-btn{ margin-top:9px; background:var(--blue-tint); color:var(--blue); border:none; border-radius:10px; padding:8px 12px; font-weight:700; font-size:12px; }
.chat-quick{ display:flex; gap:7px; padding:10px 16px; overflow-x:auto; }
.chat-quick .qp2{ background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:8px 13px; font-size:12px; font-weight:600; color:var(--blue); white-space:nowrap; }
.chat-input-bar{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-top:1px solid var(--border); background:var(--surface); }
.chat-input-bar input{ flex:1; border:1.5px solid var(--border); border-radius:22px; padding:11px 16px; font-size:13.5px; background:var(--surface-alt); }
.chat-input-bar input:focus{ outline:none; border-color:var(--blue); }
.round-btn{ width:40px;height:40px;border-radius:50%; border:none; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.round-btn.send{ background:var(--blue); color:#fff; }
.round-btn.mic{ background:var(--surface-alt); color:var(--text-soft); }
.disclaimer-box{ background:var(--amber-tint); border:1px solid #F1DDB0; color:#7A4F0A; font-size:11.5px; border-radius:10px; padding:9px 11px; line-height:1.5; }

/* Weather */
.weather-hero{ background:linear-gradient(160deg,#2E5DA8,#1D4FA8); color:#fff; border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-md); }
.weather-hero .temp{ font-size:44px; font-weight:800; line-height:1; }
.weather-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.wstat{ background:rgba(255,255,255,.14); border-radius:10px; padding:10px; text-align:center; }
.wstat b{ display:block; font-size:14px; }
.wstat small{ font-size:10px; color:rgba(255,255,255,.75); }
.risk-row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:9px; }
.risk-dot{ width:11px;height:11px;border-radius:50%; flex-shrink:0; }
.hourly-scroll{ display:flex; gap:12px; overflow-x:auto; padding:4px 2px 8px; }
.hcell{ text-align:center; min-width:52px; }
.hcell small{ color:var(--text-faint); font-size:11px; }
.hcell .hic{ font-size:19px; margin:6px 0; }
.hcell b{ font-size:12.5px; }
.day-row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; }
.day-row:last-child{ border:none; }
.ai-insight{ background:var(--teal-tint); border:1px solid #BFE6E2; border-radius:12px; padding:14px; }
.ai-insight .h{ display:flex; align-items:center; gap:7px; font-weight:800; color:var(--teal); font-size:12.5px; margin-bottom:6px; }

/* Profile */
.profile-head{ display:flex; flex-direction:column; align-items:center; padding:18px 0 6px; }
.avatar-lg{ width:78px;height:78px;border-radius:50%; background:linear-gradient(135deg,var(--blue),var(--teal)); display:flex;align-items:center;justify-content:center; color:#fff; font-size:28px; font-weight:800; margin-bottom:10px; }
.profile-list{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden; }
.profile-row{ display:flex; align-items:center; gap:12px; padding:14px; border-bottom:1px solid var(--border); }
.profile-row:last-child{ border-bottom:none; }
.profile-row .ic{ width:34px;height:34px;border-radius:9px; background:var(--surface-alt); display:flex;align-items:center;justify-content:center; color:var(--text-soft); flex-shrink:0; }
.profile-row b{ font-size:13.5px; display:block; }
.profile-row small{ color:var(--text-faint); font-size:11.5px; }
.profile-row .chev{ margin-left:auto; color:var(--text-faint); }
.profile-row.clickable{ cursor:pointer; transition:background .15s ease; }
.profile-row.clickable:active{ background:var(--surface-alt); }
.language-sheet-backdrop{ position:fixed; inset:0; background:rgba(11,18,32,.48); z-index:200; display:flex; align-items:flex-end; justify-content:center; padding:0; }
.language-sheet{ width:100%; max-width:430px; background:var(--surface); border-radius:22px 22px 0 0; padding:18px 16px 24px; box-shadow:0 -12px 35px rgba(16,27,45,.2); animation:sheetUp .18s ease; }
@keyframes sheetUp{ from{transform:translateY(18px);opacity:0;} to{transform:none;opacity:1;} }
.language-sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.language-sheet-head b{ font-size:16px; }
.language-close{ width:32px;height:32px;border:none;border-radius:9px;background:var(--surface-alt);color:var(--text-soft);font-size:20px;line-height:1; }
.language-option{ width:100%; border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:12px 14px; margin-top:8px; display:flex; align-items:center; justify-content:space-between; text-align:left; font-size:13.5px; font-weight:650; color:var(--text); }
.language-option.active{ border-color:var(--blue); background:var(--blue-tint); color:var(--blue-dark); }
.language-check{ color:var(--blue); font-weight:800; }

.family-row{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-bottom:1px solid var(--border); }
.family-row:last-child{ border-bottom:none; }
.family-avatar{ width:38px;height:38px;border-radius:50%; background:var(--blue-tint); color:var(--blue); display:flex;align-items:center;justify-content:center; font-weight:800; font-size:14px; flex-shrink:0; }
.family-row b{ font-size:13.5px; display:block; }
.family-row small{ color:var(--text-faint); font-size:11.5px; }
.completion-card{ background:linear-gradient(135deg,var(--blue-tint),#fff); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; text-align:center; }
.completion-bar{ height:6px; border-radius:4px; background:var(--border); overflow:hidden; margin:10px 0 12px; }
.completion-fill{ height:100%; background:var(--blue); border-radius:4px; }

/* Missing persons page */
.registry-banner{ display:flex; align-items:center; gap:11px; background:linear-gradient(135deg,var(--blue-tint),#fff); border:1px solid var(--border); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:16px; }
.registry-ic{ width:36px;height:36px;border-radius:10px; background:#fff; border:1px solid var(--border); color:var(--blue); display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.registry-banner b{ font-size:13px; display:block; }
.registry-banner small{ color:var(--text-faint); font-size:11px; line-height:1.4; display:block; margin-top:2px; }
.form-group{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:14px; box-shadow:var(--shadow-sm); }
.form-group-title{ font-size:11.5px; font-weight:800; color:var(--blue); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; }
.req{ color:var(--red); }
.scan-box{ width:100%; background:var(--surface-alt); border:1.5px dashed var(--border-strong); border-radius:12px; padding:16px; text-align:center; }
.scan-frame{ width:64px;height:64px; margin:0 auto 10px; border-radius:14px; border:2px dashed var(--border-strong); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--text-faint); }
.scan-frame.has-photo{ border-style:solid; border-color:var(--green); background:var(--green-tint); color:var(--green); }
.scan-box b{ display:block; font-size:12.5px; color:var(--text-soft); margin-bottom:3px; }
.scan-box small{ color:var(--text-faint); font-size:11px; }
.person-card{ width:100%; display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:12px; box-shadow:var(--shadow-sm); text-align:left; }
.person-card:active{ background:var(--surface-alt); }
.person-avatar{ width:44px;height:44px;border-radius:50%; background:var(--blue-tint); color:var(--blue); display:flex;align-items:center;justify-content:center; font-weight:800; font-size:15px; flex-shrink:0; }
.person-avatar.reunited{ background:var(--green-tint); color:var(--green); }
.person-meta{ display:flex; align-items:center; gap:4px; color:var(--text-faint); font-size:11.5px; margin-top:2px; }
.mini-progress{ display:flex; align-items:center; margin:8px 0 4px; max-width:140px; }
.mini-dot{ width:7px;height:7px;border-radius:50%; background:var(--border-strong); flex-shrink:0; }
.mini-dot.done{ background:var(--green); }
.mini-dot.active{ background:var(--blue); box-shadow:0 0 0 3px var(--blue-tint); }
.mini-bar{ height:2px; flex:1; background:var(--border-strong); }
.mini-bar.done{ background:var(--green); }

/* misc */
.subtle{ color:var(--text-faint); font-size:12.5px; line-height:1.5; }
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt20{margin-top:20px;}
.mb0{margin-bottom:0;}
.mb16{margin-bottom:16px;}
.flex-between{ display:flex; align-items:center; justify-content:space-between; }
hr.sep{ border:none; border-top:1px solid var(--border); margin:16px 0; }
.offline-banner{ background:var(--amber-tint); border-bottom:1px solid #F1DDB0; color:#7A4F0A; font-size:12px; font-weight:700; padding:8px 16px; display:flex; align-items:center; gap:7px; }
.sync-btn{ margin-left:auto; background:none; border:none; color:var(--blue); font-weight:800; font-size:11.5px; }
</style>
</head>

function push(screen,arg){ state.stack.push({screen,arg}); render(); window.scrollTo(0,0); }
function goHome(){ state.stack=[{screen:'home'}]; render(); }
function goBack(){ if(state.stack.length>1){ state.stack.pop(); } else { state.stack=[{screen:'home'}]; } render(); window.scrollTo(0,0); }
function setTab(t){ state.stack=[{screen:t}]; render(); }
function current(){ let top = state.stack[state.stack.length-1]; return typeof top==='string' ? {screen:top} : top; }

function toast(msg, ms=2600){
  const host=document.getElementById('toastHost');
  host.innerHTML = `<div class="toast">${msg}</div>`;
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>{ host.innerHTML=''; }, ms);
}

function initSosSlider(){
  const track = document.getElementById('sosSlider');
  if(!track) return;
  const thumb = document.getElementById('sosThumb');
  const fill = document.getElementById('sosFill');
  let dragging=false, startX=0, thumbStart=0;
  const maxX = ()=> track.clientWidth - thumb.clientWidth - 10;
  function setPos(x){
    x = Math.max(0, Math.min(maxX(), x));
    thumb.style.left = (5+x)+'px';
    fill.style.width = (x+60)+'px';
    return x;
  }
  function onDown(e){
    dragging=true;
    startX = (e.touches? e.touches[0].clientX : e.clientX);
    thumbStart = parseInt(thumb.style.left||5,10)-5;
  }
  function onMove(e){
    if(!dragging) return;
    const cx = (e.touches? e.touches[0].clientX : e.clientX);
    const dx = cx-startX;
    const x = setPos(thumbStart+dx);
    if(x >= maxX()-2){
      dragging=false;
      onSosComplete();
    }
  }
  function onUp(){
    if(!dragging) return;
    dragging=false;
    const x = parseInt(thumb.style.left||5,10)-5;
    if(x < maxX()-2){ setPos(0); }
  }
  thumb.addEventListener('mousedown',onDown);
  thumb.addEventListener('touchstart',onDown,{passive:true});
  window.addEventListener('mousemove',onMove);
  window.addEventListener('touchmove',onMove,{passive:true});
  window.addEventListener('mouseup',onUp);
  window.addEventListener('touchend',onUp);
}
function onSosComplete(){
  push('sosConfirm');
}

  state.sos.id = 'SOS-'+Math.floor(10000+Math.random()*89999);

const SOS_STEPS = ['SOS Submitted','Under Verification','Rescue Team Assigned','Rescue Team En Route','Rescue Completed'];
function startSosProgress(){
  clearInterval(window.__sosTimer);
  window.__sosTimer = setInterval(()=>{
    if(state.sos.step < SOS_STEPS.length-1){
      state.sos.step++;
      if(current().screen==='sosStatus') render();
      toast(SOS_STEPS[state.sos.step]);
    } else {
      clearInterval(window.__sosTimer);
    }
  }, 4200);
}

function stepperHTML(step){

  labels.forEach((l,i)=>{

    html += `<div class="step ${cls}"><div class="circle">${n<step?ic('check',12):n}</div><div class="label">${l}</div></div>`;
    if(i<labels.length-1) html += `<div class="bar ${n<step?'done':''}"></div>`;
  });
  html += '</div>';
  return html;
}

function initMap(){
  const el = document.getElementById('leafletMap');
  if(!el || typeof L==='undefined') return;
  if(leafletMap){ leafletMap.remove(); leafletMap=null; }
  leafletMap = L.map(el,{zoomControl:false}).setView([26.1445,91.7362],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:19, attribution:'© OpenStreetMap' }).addTo(leafletMap);
  L.control.zoom({position:'bottomright'}).addTo(leafletMap);

  // Flood danger zone
  L.circle([26.1465,91.7375],{radius:900,color:'#D8332B',weight:2,fillColor:'#D8332B',fillOpacity:0.13}).addTo(leafletMap)
    .bindTooltip('Danger Zone • Flood Level 2', {permanent:false});
  // Safe zone
  L.circle([26.1395,91.7300],{radius:600,color:'#1C8A4B',weight:2,fillColor:'#1C8A4B',fillOpacity:0.12}).addTo(leafletMap)
    .bindTooltip('Certified Safe Zone', {permanent:false});
  // User location
  L.circleMarker([26.1440,91.7350],{radius:8,color:'#0E8A82',weight:3,fillColor:'#fff',fillOpacity:1}).addTo(leafletMap)
    .bindPopup('<div class="popup-card"><b>You are here</b><div class="pmeta">GPS accurate · Safe zone</div></div>');

  function dot(color,label){ return L.divIcon({className:'', html:`<div style="width:28px;height:28px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12.5px;font-weight:800">${label}</div>`, iconSize:[28,28], iconAnchor:[14,14]}); }
  const colors = {incidents:'#D8332B', shelters:'#1D4FA8', hospitals:'#0E8A82', roadblocks:'#C9740A'};
  const labels = {incidents:'!', shelters:'S', hospitals:'H', roadblocks:'R'};
  layerGroups = {};
  Object.keys(MAP_MARKERS).forEach(cat=>{
    const grp = L.layerGroup();
    MAP_MARKERS[cat].forEach(m=>{
      const mk = L.marker([m.lat,m.lng],{icon:dot(colors[cat],labels[cat])});
      mk.bindPopup(`<div class="popup-card"><b>${m.title}</b><div class="pmeta">${m.loc} • ${m.severity} • ${m.dist}</div><button class="chat-inline-btn" onclick="window.__viewMarker && window.__viewMarker('${cat}','${m.id}')">View Incident</button></div>`);
      grp.addLayer(mk);
    });
    layerGroups[cat]=grp;
    grp.addTo(leafletMap);
  });
  window.__viewMarker = function(cat,id){
    toast('Opening incident details…');
  };
  applyMapFilter();
}
function applyMapFilter(){
  if(!leafletMap) return;
  const f = state.activeMapFilter;
  Object.keys(layerGroups).forEach(cat=>{
    if(f==='all' || f===cat){ if(!leafletMap.hasLayer(layerGroups[cat])) layerGroups[cat].addTo(leafletMap); }
    else { if(leafletMap.hasLayer(layerGroups[cat])) leafletMap.removeLayer(layerGroups[cat]); }
  });
}
function initMiniMap(elId, coords, color){
  const el = document.getElementById(elId);
  if(!el || typeof L==='undefined') return;
  const m = L.map(el,{zoomControl:false, dragging:true, scrollWheelZoom:false}).setView(coords,15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(m);
  L.circleMarker(coords,{radius:9,color:color||'#1D4FA8',weight:3,fillColor:'#fff',fillOpacity:1}).addTo(m);
  setTimeout(()=>m.invalidateSize(),80);
  m.on('click',(e)=>{
    if(elId==='reportMiniMap'){
      state.reportForm.location = e.latlng.lat.toFixed(4)+', '+e.latlng.lng.toFixed(4);
      render();
    }
  });
}

  const reply = match ? match.a : "I can help with shelters, evacuation routes, weather risk and incident reporting. If you are in immediate danger, use SEND SOS or contact emergency services directly.";

  const pct = Math.min(100, fam.length===0? 40 : 40 + Math.min(fam.length,3)*20);
  let html = `<div class="section-title" style="margin-top:22px">Family &amp; Emergency Contacts</div>`;

  if(fam.length===0 && !state.showAddFamily){
    html += `<div class="completion-card">
      <b style="font-size:14px">Complete your profile</b>
      <div class="completion-bar"><div class="completion-fill" style="width:${pct}%"></div></div>
      <p class="subtle" style="margin:0 0 12px">Add family members' names and phone numbers so responders and HopeFinder AI can reach them for you during an emergency.</p>
      <button class="btn primary" data-action="toggleAddFamily">${ic('users',16)} Add Family Member</button>
    </div>`;
  } else {
    if(fam.length>0){
      html += `<div class="profile-list">
        ${fam.map((m,i)=>`
          <div class="family-row">
            <div class="family-avatar">${(m.name||'?')[0].toUpperCase()}</div>
            <div style="flex:1;min-width:0"><b>${m.name}</b><small>${m.relation? m.relation+' • ':''}${m.phone}</small></div>
            <button class="pill-btn gray" data-action="removeFamily" data-idx="${i}">Remove</button>
          </div>`).join('')}
      </div>`;
    }
    if(!state.showAddFamily){
      html += `<button class="btn outline mt12" data-action="toggleAddFamily">${ic('users',15)} Add ${fam.length? 'Another' : 'a'} Family Member</button>`;
    }
  }

  if(state.showAddFamily){
    html += `<div class="card mt12" style="padding:14px;">
      <div class="field"><label>Full name</label><input type="text" id="famName" placeholder="Full name"/></div>
      <div class="btn-row">
        <div class="field" style="flex:1"><label>Relation</label><input type="text" id="famRelation" placeholder="e.g. Mother, Brother"/></div>

/* ---------- ROUTER / RENDER ---------- */
const ACTIVE_TAB_BY_SCREEN = {
  home:'home', officialAlert:'home', sos:'home', sosConfirm:'home', sosStatus:'home',
  shelters:'home', shelterDetails:'home', missing:'home', missingMatch:'home',
  risk:'home', feed:'home', feedDetail:'home', chat:'home',
  reportStep1:'reports', reportStep2:'reports', reportStep3:'reports', reportStatus:'reports', reports:'reports',
  map:'map',
  alerts:'alerts', alertDetails:'alerts',
  profile:'profile',
};
function render(){
  const {screen, arg} = current();
  let html = '';
  switch(screen){
    case 'home': html = screenHome(); break;
    case 'officialAlert': html = officialAlertDetails(); break;
    case 'sos': html = screenSOS(); break;
    case 'sosConfirm': html = screenSosConfirm(); break;
    case 'sosStatus': html = screenSosStatus(); break;
    case 'shelters': html = screenShelters(); break;
    case 'shelterDetails': html = screenShelterDetails(arg); break;
    case 'reportStep1': html = screenReportStep1(); break;
    case 'reportStep2': html = screenReportStep2(); break;
    case 'reportStep3': html = screenReportStep3(); break;
    case 'reportStatus': html = screenReportStatus(); break;
    case 'reports': html = screenReportsList(); break;
    case 'missing': html = screenMissing(); break;
    case 'missingMatch': html = screenMissingMatch(); break;
    case 'map': html = screenMap(); break;
    case 'risk': html = screenRisk(); break;
    case 'feed': html = screenFeed(); break;
    case 'feedDetail': html = screenFeedDetail(arg); break;
    case 'chat': html = screenChat(); break;
    case 'alerts': html = screenAlerts(); break;
    case 'alertDetails': html = screenAlertDetails(arg); break;
    case 'profile': html = screenProfile(); break;
    default: html = screenHome();
  }
  document.getElementById('app').innerHTML = html;
  document.getElementById('bottomNavHost').innerHTML = bottomNav(ACTIVE_TAB_BY_SCREEN[screen] || 'home');
  document.getElementById('app').scrollTop = 0;

  if(screen==='sos') initSosSlider();
  if(screen==='map') setTimeout(initMap, 30);
  if(screen==='shelterDetails'){ const s=SHELTERS.find(x=>x.id===arg)||SHELTERS[0]; setTimeout(()=>initMiniMap('shelterMiniMap',[26.1489,91.7392],'#1D4FA8'),30); }
  if(screen==='reportStep2') setTimeout(()=>initMiniMap('reportMiniMap',[26.1445,91.7362],'#D8332B'),30);
  if(screen==='chat'){ const sc=document.getElementById('chatScroll'); if(sc) sc.scrollTop = sc.scrollHeight; }
  const langHost = document.getElementById('languageSheetHost');
  if(langHost) langHost.innerHTML = state.languageOpen ? languageSheet() : '';
}

/* ---------- ACTIONS ---------- */
document.addEventListener('click', function(e){
  const navEl = e.target.closest('[data-nav]');
  const backEl = e.target.closest('[data-back]');
  const actionEl = e.target.closest('[data-action]');
  const promptEl = e.target.closest('[data-chatprompt]');

  if(promptEl){
    const t = promptEl.getAttribute('data-chatprompt');
    push('chat');
    setTimeout(()=>sendChatMessage(t), 120);
    return;
  }
  if(backEl){ goBack(); return; }
  if(navEl){
    const screen = navEl.getAttribute('data-nav');
    const arg = navEl.getAttribute('data-arg');
    if(navEl.classList.contains('nav-item') || navEl.classList.contains('nav-sos')){
      if(screen==='sos'){ push('sos'); } else { setTab(screen); }
      return;
    }
    push(screen, arg);
    return;
  }
  if(actionEl){
    const act = actionEl.getAttribute('data-action');
    handleAction(act, actionEl);
    return;
  }
});

function handleAction(act, el){
  switch(act){
    case 'openLanguage':
      state.languageOpen = true;
      render();
      break;
    case 'closeLanguage':
      state.languageOpen = false;
      render();
      break;
    case 'selectLanguage':
      state.language = el.getAttribute('data-lang') || 'English';
      state.languageOpen = false;
      toast('✓ Language set to ' + state.language);
      render();
      break;
    case 'toggleOffline':
      state.offline = !state.offline;
      toast(state.offline? '⚠ Offline mode enabled — data will be saved locally' : '✓ Back online — data synchronized successfully.');
      render();
      break;
    case 'tryNow':
      if(state.syncQueue>0){ state.syncQueue=0; state.offline=false; toast('✓ Data synchronized successfully.'); render(); }
      break;
    case 'callResource':
      toast('📞 Calling '+el.getAttribute('data-name')+'…');
      break;
    case 'routeTo':
      toast('🧭 Routing to '+el.getAttribute('data-name')+'…');
      break;
    case 'voice':
      toast('🎤 Voice input is simulated in this prototype.');
      break;
    case 'confirmSos':
      confirmSos();
      break;
    case 'setIncType':
      state.reportForm.type = el.getAttribute('data-val');
      render();
      break;
    case 'mockUpload':
      state.reportForm.photo = true;
      toast('📷 Photo attached');
      render();
      break;
    case 'toggleMedical':
      state.reportForm.medical = !state.reportForm.medical;
      render();
      break;
    case 'reportStep1Next':
      state.reportForm.desc = (document.getElementById('descInput')||{}).value || state.reportForm.desc;
      state.reportForm.people = (document.getElementById('peopleInput')||{}).value || state.reportForm.people;
      if(!state.reportForm.type){ toast('Please select an incident type'); return; }
      push('reportStep2');
      break;
    case 'useCurrentLocation':
      state.reportForm.location = 'Sector 7, Guwahati (GPS)';
      toast('📍 Current location captured');
      render();
      break;
    case 'reportStep2Next':
      push('reportStep3');
      break;
    case 'submitIncident':
      const id = 'INC-'+Math.floor(1000+Math.random()*8999);
      state.myReports.unshift({id, type:state.reportForm.type||'Flood', severity:'HIGH', time:'Just now', status:'AI Analyzed', people:state.reportForm.people||'—'});
      if(state.offline){ state.syncQueue++; toast('Saved locally — will sync when connection is restored.'); }
      state.stack = state.stack.slice(0,-3);
      push('reportStatus');
      state.reportForm = { type:null, desc:'', people:'', medical:false, photo:false, location:null };
      break;
    case 'missingTab':
      state.missingTab = el.getAttribute('data-val');
      render();
      break;
    case 'mockUploadMissing':
      state.missingForm.photo = true;
      toast('📷 Photo attached');
      render();
      break;
    case 'submitMissing':{
      const f = state.missingForm;
      f.name = (document.getElementById('mName')||{}).value || f.name;
      f.age = (document.getElementById('mAge')||{}).value || f.age;
      f.gender = (document.getElementById('mGender')||{}).value || f.gender;
      f.lastSeen = (document.getElementById('mLoc')||{}).value || f.lastSeen;
      f.lastSeenTime = (document.getElementById('mTime')||{}).value || f.lastSeenTime;
      f.clothing = (document.getElementById('mCloth')||{}).value || f.clothing;
      f.notes = (document.getElementById('mNotes')||{}).value || f.notes;
      f.contact = (document.getElementById('mContact')||{}).value || f.contact;
      f.relation = (document.getElementById('mRelation')||{}).value || f.relation;
      if(!f.name){ toast("Please enter the person's name"); return; }
      const mid = 'MP-'+Math.floor(1000+Math.random()*8999);
      state.myMissing.unshift({id:mid, name:f.name, time:'just now', status:'AI Matching in Progress'});
      toast('✓ Report created — AI matching in progress');
      state.missingForm = { name:'', age:'', gender:null, photo:false, lastSeen:'', lastSeenTime:'', clothing:'', notes:'', contact:'', relation:'' };
      setTimeout(()=>push('missingMatch'), 500);
      break;
    }
    case 'reportIncorrectMatch':
      toast('Thank you — this match has been flagged for review.');
      break;
    case 'viewMatch':
      push('shelterDetails','SH-04');
      break;
    case 'mapFilter':
      state.activeMapFilter = el.getAttribute('data-val');
      applyMapFilter();
      render();
      setTimeout(()=>initMap(),20);
      break;
    case 'focusMarker':{
      const cat = el.getAttribute('data-cat');
      const mid = el.getAttribute('data-id');
      const m = (MAP_MARKERS[cat]||[]).find(x=>x.id===mid);
      if(!m) break;
      state.activeMapFilter = 'all';
      render();
      setTimeout(()=>{
        initMap();
        setTimeout(()=>{
          if(!leafletMap) return;
          leafletMap.setView([m.lat,m.lng],16);
          const grp = layerGroups[cat];
          if(grp){
            grp.eachLayer(l=>{
              const ll = l.getLatLng();
              if(Math.abs(ll.lat-m.lat)<0.0001 && Math.abs(ll.lng-m.lng)<0.0001){ l.openPopup(); }
            });
          }
        }, 80);
      }, 30);
      break;
    }
    case 'feedTab':
      state.feedTab = el.getAttribute('data-val');
      render();
      break;
    case 'markRead':{
      const aid = el.getAttribute('data-arg');
      const a = state.alerts.find(x=>x.id===aid);
      if(a) a.read = true;
      render();
      break;
    }
    case 'sendChat':{
      const inp = document.getElementById('chatInput');
      if(inp && inp.value.trim()){ sendChatMessage(inp.value.trim()); inp.value=''; }
      break;
    }
    case 'chatBtn':{
      const go = el.getAttribute('data-go');
      const arg = el.getAttribute('data-arg');
      push(go, arg||undefined);
      break;
    }
    case 'editProfile':
      toast('Profile editing is simulated in this prototype.');
      break;
    case 'toggleAddFamily':
      state.showAddFamily = true;
      render();
      setTimeout(()=>{ const el2=document.getElementById('famName'); if(el2) el2.focus(); }, 50);
      break;
    case 'cancelAddFamily':
      state.showAddFamily = false;
      render();
      break;
    case 'saveFamily':{
      const name = (document.getElementById('famName')||{}).value || '';
      const relation = (document.getElementById('famRelation')||{}).value || '';
      const phone = (document.getElementById('famPhone')||{}).value || '';
      if(!name.trim() || !phone.trim()){ toast('Please enter a name and phone number'); return; }
      state.family.push({name:name.trim(), relation:relation.trim(), phone:phone.trim()});
      state.showAddFamily = false;
      toast('✓ Family member added');
      render();
      break;
    }
    case 'removeFamily':{
      const idx = parseInt(el.getAttribute('data-idx'),10);
      state.family.splice(idx,1);
      toast('Family member removed');
      render();
      break;
    }
  }
}

document.addEventListener('keydown', function(e){
  if(e.key==='Enter' && document.activeElement && document.activeElement.id==='chatInput'){
    handleAction('sendChat');
  }
});

/* Prevent card-level nav from double firing on nested "stop" buttons that are also inside data-nav card */
document.addEventListener('click', function(e){
  const stopEl = e.target.closest('[data-stop]');
  if(stopEl){ e.stopPropagation(); }
}, true);

/* ---------- STATUS BAR CLOCK ---------- */
function updateClock(){
  const el = document.getElementById('clockTxt');
  if(!el) return;
  const d = new Date();
  let h = d.getHours(); const m = d.getMinutes();
  const ampm = h>=12?'pm':'am';
  h = h%12; if(h===0) h=12;
  el.textContent = h+':'+String(m).padStart(2,'0')+' '+ampm;
}
updateClock();
setInterval(updateClock, 15000);

/* ---------- FIT PHONE FRAME TO VIEWPORT ----------
   vh/vw units are unreliable inside embedded iframes (the artifact preview
   can report a taller layout than what's actually visible, clipping the
   phone off-screen). Measuring window.innerWidth/innerHeight directly and
   sizing the frame in JS guarantees it always fits fully on screen. */
function fitPhoneFrame(){
  const frame = document.querySelector('.phone-frame');
  if(!frame) return;
  const MARGIN = 14;      // breathing room around the phone
  const ASPECT = 400/800; // width / height — slightly wider than a real phone for readability
  const MAX_W = 440;      // don't let it get comically large on big screens

  const availW = Math.max(240, window.innerWidth - MARGIN*2);
  const availH = Math.max(420, window.innerHeight - MARGIN*2);

  let w = Math.min(availW, MAX_W);
  let h = w / ASPECT;
  if(h > availH){
    h = availH;
    w = h * ASPECT;
  }
  frame.style.width = Math.round(w) + 'px';
  frame.style.height = Math.round(h) + 'px';
}
window.addEventListener('resize', fitPhoneFrame);
window.addEventListener('orientationchange', fitPhoneFrame);
fitPhoneFrame();
// Re-measure once more after fonts/layout settle (helps in some iframe hosts).
setTimeout(fitPhoneFrame, 150);
setTimeout(fitPhoneFrame, 500);

/* ---------- INIT ---------- */
render();
